<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Criterion Channel</title>
<style>html,body{margin:0;height:100%;background:#0b0b0b;color:#eee;font:28px/1.4 Helvetica,Arial,sans-serif}
.c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.n{letter-spacing:.35em;font-size:44px}.s{opacity:.6;font-size:22px;margin-top:16px}</style>
</head>
<body>
<div class="c"><div class="n">CRITERION</div><div class="s" id="s">Opening…</div></div>
<script>
// Hands off to TizenBrew with a module launch request.
//
// TizenBrew's UI passes a launch request to its background service as soon as
// the UI's socket opens. On a cold start the service has not loaded its module
// list yet, the lookup throws, and the UI falls back to its menu. So: warm the
// service first (launch it, wait for its loopback socket, give the module list
// a few seconds), then launch TizenBrew with the request. TizenBrew also exits
// and relaunches itself under its debugger on a cold start, so this page must
// not exit during that gap: it stays underneath and leaves only once it is
// visible again for six seconds.
(function () {
  var MODULE = { moduleName: 'BaesTheorem/tizenbrew-criterion@a207e27', moduleType: 'gh', args: '' };
  var APP = 'xvvl3S1bvH.TizenBrewStandalone';
  var SERVICE = 'xvvl3S1bvH.StandaloneService';
  var SOCKET = 'ws://127.0.0.1:8081';
  var handedOff = false, timer = null;
  function status(msg) { document.getElementById('s').textContent = msg; }
  function leave() { try { tizen.application.getCurrentApplication().exit(); } catch (e) {} }
  document.addEventListener('visibilitychange', function () {
    if (!handedOff) return;
    if (document.hidden) { clearTimeout(timer); timer = null; return; }
    status('Leaving…');
    timer = setTimeout(function () { if (!document.hidden) leave(); }, 6000);
  });
  document.addEventListener('keydown', function (e) { if (e.keyCode === 10009) leave(); });

  function launchApp() {
    status('Opening Criterion…');
    try {
      var data = [new tizen.ApplicationControlData('module', [JSON.stringify(MODULE)])];
      var ctl = new tizen.ApplicationControl('http://tizen.org/appcontrol/operation/default', null, null, null, data);
      tizen.application.launchAppControl(ctl, APP,
        function () { handedOff = true; },
        function (e) { status('TizenBrew did not start: ' + e.message); });
    } catch (e) { status('Launch failed: ' + e.message); }
  }

  // Probe the service socket. Never send anything on it: the service treats
  // the newest client that speaks as its UI.
  function probe(tries) {
    var ws, done = false;
    try { ws = new WebSocket(SOCKET); } catch (e) { return retry(tries); }
    ws.onopen = function () { done = true; ws.close(); setTimeout(launchApp, 5000); };
    ws.onerror = function () { if (!done) { done = true; retry(tries); } };
    setTimeout(function () { if (!done) { done = true; try { ws.close(); } catch (e) {} retry(tries); } }, 1500);
  }
  function retry(tries) {
    if (tries >= 20) { status('Service did not answer; opening TizenBrew anyway'); launchApp(); return; }
    setTimeout(function () { probe(tries + 1); }, 1000);
  }

  // Warm the service. If this TV refuses to start another package's service,
  // the probe loop still catches a service that TizenBrew started earlier.
  function warm() {
    status('Starting TizenBrew service…');
    try {
      tizen.application.launchAppControl(
        new tizen.ApplicationControl('http://tizen.org/appcontrol/operation/service'), SERVICE,
        function () {}, function () {});
    } catch (e) {}
    probe(0);
  }
  warm();
})();
</script>
</body>
</html>
